name: Build and Push Docker Images

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ./back/Dockerfile.backend.prod
            image: backend
            context: ./back
          - dockerfile: ./back/Dockerfile.sync.prod
            image: sync
            context: ./back
          - dockerfile: ./frontend/Dockerfile.frontend.prod
            image: frontend
            context: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ${{ matrix.image == 'frontend' && format('REACT_APP_AZURE_AD_CLIENT_ID={0}', secrets.AZURE_AD_CLIENT_ID) || '' }}
            ${{ matrix.image == 'frontend' && format('REACT_APP_AZURE_AD_TENANT_ID={0}', secrets.AZURE_AD_TENANT_ID) || '' }}
            ${{ matrix.image == 'frontend' && format('REACT_APP_AZURE_AD_REDIRECT_URI={0}', secrets.AZURE_AD_REDIRECT_URI) || '' }}
            REACT_APP_API_URL=/api

  # --------------------------------------------------------------------------
  # Deploy to production VPS via SSH
  # --------------------------------------------------------------------------
  # Only runs on push to main (not PRs, not dev branch).
  # Waits for all 3 images to build successfully before deploying.
  # Uses a dedicated deploy SSH key (not a personal key).
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/dendreo/
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/dendreo
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Graceful deploy: wait for any running sync to finish before replacing containers.
            # Checks if sync_dendreo.py is running inside the sync container; waits up to 10 min.
            WAIT_MAX=60
            WAIT_COUNT=0
            while docker exec dendreo_sync_prod pgrep -f sync_dendreo.py > /dev/null 2>&1; do
              WAIT_COUNT=$((WAIT_COUNT + 1))
              if [ "$WAIT_COUNT" -ge "$WAIT_MAX" ]; then
                echo "WARNING: Sync still running after $((WAIT_MAX * 30 / 60)) min — proceeding with deploy anyway"
                break
              fi
              echo "Sync in progress, waiting 30s... ($((WAIT_COUNT * 30 / 60))m / $((WAIT_MAX * 30 / 60))m)"
              sleep 30
            done

            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans
            docker image prune -f
            echo "Waiting for backend health..."
            sleep 10
            curl -sf http://localhost:8000/health || echo "WARNING: Health check failed"
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps
          envs: GHCR_TOKEN,GHCR_USER
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
