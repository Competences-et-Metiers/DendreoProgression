name: TEMP - Renew SSL Cert via CI Key

# Manual-only stopgap: the personal SSH key normally used for server access
# isn't available right now, but the CI deploy key (secrets.VPS_SSH_KEY)
# still works. This renews the existing Let's Encrypt cert using the
# standalone plugin, which requires briefly stopping the nginx container
# to free port 80/443 for the ACME challenge.
#
# Delete this workflow once proper renewal automation (ACME webroot +
# certbot deploy-hook + systemd timer) is set up on the server directly.
on:
  workflow_dispatch:

jobs:
  renew-cert:
    runs-on: ubuntu-latest
    steps:
      - name: Renew cert on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/dendreo

            CERT_NAME=$(sudo certbot certificates 2>/dev/null | grep "Certificate Name:" | head -1 | awk '{print $3}')
            if [ -z "$CERT_NAME" ]; then
              echo "No certbot-managed certificate found on this host — aborting."
              exit 1
            fi
            echo "Renewing cert: $CERT_NAME"

            echo "Stopping nginx to free port 80/443 for the standalone ACME challenge..."
            docker compose -f docker-compose.prod.yml stop nginx

            sudo certbot renew --cert-name "$CERT_NAME" --force-renewal

            LIVE_DIR="/etc/letsencrypt/live/$CERT_NAME"
            sudo cp "$LIVE_DIR/fullchain.pem" ssl/fullchain.pem
            sudo cp "$LIVE_DIR/privkey.pem" ssl/privkey.pem
            sudo chown "$(whoami)":"$(whoami)" ssl/fullchain.pem ssl/privkey.pem

            echo "Restarting nginx..."
            docker compose -f docker-compose.prod.yml start nginx

            sleep 8
            echo "New cert expiry:"
            echo | openssl s_client -connect localhost:443 -servername dendreo.competences-et-metiers.com 2>/dev/null | openssl x509 -noout -enddate
            docker compose -f docker-compose.prod.yml ps nginx
