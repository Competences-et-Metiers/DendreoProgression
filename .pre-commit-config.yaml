repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: name-tests-test
        args: ['--pytest-test-first']

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        files: '^back/.*\.py$'

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        files: '^back/.*\.py$'
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']

  - repo: local
    hooks:
      - id: no-cache-files
        name: Prevent cache files from being committed
        entry: bash -c 'if git diff --cached --name-only | grep -E "(__pycache__|\.pyc$|\.pyo$|\.log$)"; then echo "❌ Cache or log files found in commit. Please remove them."; exit 1; fi'
        language: system
        pass_filenames: false

      - id: no-env-files
        name: Prevent environment files from being committed
        entry: bash -c 'if git diff --cached --name-only | grep -E "(\.env$|\.env\.local$|back/\.env$)"; then echo "❌ Environment files found in commit. Please remove them."; exit 1; fi'
        language: system
        pass_filenames: false 