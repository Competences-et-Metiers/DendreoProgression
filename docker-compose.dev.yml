version: '3.8'

services:
  # Development Backend - builds from local files
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile.dev
      args:
        - BRANCH=dev
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/dendreo_dev_db
      APP_ENV: development
      LOG_LEVEL: DEBUG
      PYTHONUNBUFFERED: 1
    volumes:
      # Mount logs to host for easy debugging
      - ./dev-logs:/app/logs
      # Mount source code for hot reload
      - ./back:/app
    restart: "no"  # Don't auto-restart in development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug

  # Development Frontend - builds from local files
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        - BRANCH=dev
    environment:
      NODE_ENV: development
      REACT_APP_API_URL: http://localhost:8000/api
      # Enable React development features
      FAST_REFRESH: true
      CHOKIDAR_USEPOLLING: true
    volumes:
      # Mount source for hot reload
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    restart: "no"
    # Use development server instead of nginx
    command: npm start

  # Development Database - same as base but with dev-specific settings
  postgres:
    environment:
      POSTGRES_DB: dendreo_dev_db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d/
      # Add sample data for development
      - ./database/dev-data:/docker-entrypoint-initdb.d/99-dev-data/
    ports:
      # Expose on different port to avoid conflicts
      - "5433:5432"

volumes:
  postgres_dev_data:
    driver: local

# Override network name for development
networks:
  dendreo_network:
    name: dendreo_dev_network