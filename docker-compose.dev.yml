services:
  # Development Backend - runs on remote machine
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Use postgres:5432 when running in Docker containers
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/dendreo_dev_db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
      # API Configuration
      DENDREO_API_KEY: ${DENDREO_API_KEY:-your_dendreo_api_key_here}
      DENDREO_BASE_URL: ${DENDREO_BASE_URL:-https://pro.dendreo.com/competences_et_metiers/api}
      HUBSPOT_API_KEY: ${HUBSPOT_API_KEY:-your_hubspot_api_key_here}
      # Redis configuration (optional)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      # Timezone configuration
      POSTGRES_TZ: ${POSTGRES_TZ:-Europe/Paris}
      TZ: ${TZ:-Europe/Paris}
    env_file:
      - .env.dev
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    volumes:
      - ./dev-logs:/app/logs:rw
      - ./back:/app
      # Timezone mapping
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: sh -c "chmod 777 /app/logs && uvicorn app.main:app --host ${HOST:-0.0.0.0} --port ${PORT:-8000} --reload --log-level info"
    depends_on:
      - postgres
    networks:
      - dendreo_network

  # Development Sync Service
  sync:
    build:
      context: ./back
      dockerfile: Dockerfile.sync
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Use postgres:5432 when running in Docker containers
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/dendreo_dev_db
      LOG_LEVEL: ${SYNC_LOG_LEVEL:-DEBUG}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
      # API Configuration
      DENDREO_API_KEY: ${DENDREO_API_KEY:-your_dendreo_api_key_here}
      DENDREO_BASE_URL: ${DENDREO_BASE_URL:-https://pro.dendreo.com/competences_et_metiers/api}
      HUBSPOT_API_KEY: ${HUBSPOT_API_KEY:-your_hubspot_api_key_here}
      # Redis configuration (optional)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      # Timezone configuration
      POSTGRES_TZ: ${POSTGRES_TZ:-Europe/Paris}
      TZ: ${TZ:-Europe/Paris}
      # Sync Configuration for development
      SYNC_SCHEDULE: ${SYNC_SCHEDULE:-0 8 * * *}  # Every day at 8 AM
      DENDREO_ADF_LIMIT: ${DENDREO_ADF_LIMIT:-10}  # Limit to 10 for development
    env_file:
      - .env.dev
    volumes:
      - ./dev-logs:/app/logs:rw
      - sync_dev_logs:/app/logs/sync
      # Timezone mapping
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - postgres
      - backend
    networks:
      - dendreo_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "scripts/sync_health_check.py", "--nagios", "--exit-code"]
      interval: 30m  # Less frequent for development
      timeout: 30s
      retries: 2
      start_period: 2m

  # Development Frontend - runs on remote machine
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        BRANCH: ${DEV_BRANCH:-dev}
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000/api}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${FRONTEND_PORT:-3000}
      GENERATE_SOURCEMAP: ${GENERATE_SOURCEMAP:-false}
      SKIP_PREFLIGHT_CHECK: ${SKIP_PREFLIGHT_CHECK:-true}
      FAST_REFRESH: ${FAST_REFRESH:-true}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      # Timezone mapping
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: sh -c "npm ci --legacy-peer-deps && npm start"
    networks:
      - dendreo_network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Portainer - Container Management UI
  portainer:
    image: portainer/portainer-ce:latest
    container_name: dendreo_portainer_dev
    ports:
      - "${PORTAINER_HTTP_PORT:-9000}:9000"
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_dev_data:/data
      # Timezone mapping
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - dendreo_network
    restart: unless-stopped

  # Development Database - runs on remote machine
  postgres:
    image: postgres:15
    container_name: dendreo_postgres_dev
    env_file:
      - .env.dev
    environment:
      # Set PostgreSQL timezone to match container timezone
      POSTGRES_TZ: ${POSTGRES_TZ:-Europe/Paris}
      TZ: ${TZ:-Europe/Paris}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"  # External port to avoid conflicts
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d/
      # Timezone mapping
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - dendreo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dendreo_dev_db}"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_dev_data:
    driver: local
  frontend_node_modules:
    driver: local
  portainer_dev_data:
    driver: local
  sync_dev_logs:
    driver: local

networks:
  dendreo_network:
    driver: bridge 