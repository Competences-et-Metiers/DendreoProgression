services:
  # Development Backend - runs on remote machine
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED}
      # API Configuration
      DENDREO_API_KEY: ${DENDREO_API_KEY}
      DENDREO_BASE_URL: ${DENDREO_BASE_URL}
      HUBSPOT_API_KEY: ${HUBSPOT_API_KEY}
      # Redis configuration (optional)
      REDIS_URL: ${REDIS_URL}
      REDIS_ENABLED: ${REDIS_ENABLED}
    env_file:
      - .env.dev
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./dev-logs:/app/logs:rw
      - ./back:/app
    command: sh -c "chmod 777 /app/logs && uvicorn app.main:app --host ${HOST} --port ${PORT} --reload --log-level info"
    depends_on:
      - postgres
    networks:
      - dendreo_network

  # Development Frontend - runs on remote machine
  frontend:
    image: node:18-alpine
    working_dir: /app
    environment:
      NODE_ENV: ${NODE_ENV}
      REACT_APP_API_URL: ${REACT_APP_API_URL}
      HOST: ${HOST}
      PORT: ${FRONTEND_PORT}
      GENERATE_SOURCEMAP: ${GENERATE_SOURCEMAP}
      SKIP_PREFLIGHT_CHECK: ${SKIP_PREFLIGHT_CHECK}
      FAST_REFRESH: ${FAST_REFRESH}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm start"
    networks:
      - dendreo_network
    depends_on:
      - backend

  # Portainer - Container Management UI
  portainer:
    image: portainer/portainer-ce:latest
    container_name: dendreo_portainer_dev
    ports:
      - "${PORTAINER_HTTP_PORT}:9000"
      - "${PORTAINER_HTTPS_PORT}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_dev_data:/data
    networks:
      - dendreo_network
    restart: unless-stopped

  # Development Database - runs on remote machine
  postgres:
    image: postgres:15
    container_name: dendreo_postgres_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: ${PGDATA}
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432"  # External port to avoid conflicts
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d/
    networks:
      - dendreo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_dev_data:
    driver: local
  frontend_node_modules:
    driver: local
  portainer_dev_data:
    driver: local

networks:
  dendreo_network:
    driver: bridge 