services:
  # Development Backend
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: development
      # Connect to remote database on 192.168.254.82
      DATABASE_URL: postgresql://postgres:admin@192.168.254.82:5432/dendreo_dev_db
      LOG_LEVEL: DEBUG
      PYTHONUNBUFFERED: 1
      # Redis configuration (optional)
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: false
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
    volumes:
      - ./dev-logs:/app/logs
      - ./back:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    # No dependency on local postgres since using remote database
    networks:
      - dendreo_network

  # Development Frontend - Simplified approach without custom scripts
  frontend:
    image: node:18-alpine
    working_dir: /app
    environment:
      NODE_ENV: development
      # Point to remote machine where backend and database are located
      REACT_APP_API_URL: http://192.168.254.82:8000/api
      HOST: 0.0.0.0
      PORT: 3000
      GENERATE_SOURCEMAP: false
      SKIP_PREFLIGHT_CHECK: true
      FAST_REFRESH: true
      CHOKIDAR_USEPOLLING: true
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm start"
    networks:
      - dendreo_network
    depends_on:
      - backend

  # Development Database (OPTIONAL - only needed if not using remote database)
  # This service is disabled by default since using remote database
  postgres:
    image: postgres:15
    container_name: dendreo_postgres_dev
    environment:
      POSTGRES_DB: dendreo_dev_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d/
    networks:
      - dendreo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dendreo_dev_db"]
      interval: 30s
      timeout: 10s
      retries: 3
    # profiles:
    #   - local-db  # Temporarily enable local database

  # Optional: Redis for caching (can be enabled by setting REDIS_ENABLED=true)
  redis:
    image: redis:7-alpine
    container_name: dendreo_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - dendreo_network
    profiles:
      - redis

volumes:
  postgres_dev_data:
    driver: local
  frontend_node_modules:
    driver: local
  redis_dev_data:
    driver: local

networks:
  dendreo_network:
    driver: bridge 