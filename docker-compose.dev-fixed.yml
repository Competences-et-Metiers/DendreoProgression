services:
  # Development Backend
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/dendreo_dev_db
      APP_ENV: development
      LOG_LEVEL: DEBUG
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    volumes:
      - ./dev-logs:/app/logs
      - ./back:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    depends_on:
      - postgres
    networks:
      - dendreo_network

  # Development Frontend - Simplified approach without custom scripts
  frontend:
    image: node:18-alpine
    working_dir: /app
    environment:
      NODE_ENV: development
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000/api}
      HOST: 0.0.0.0
      PORT: 3000
      GENERATE_SOURCEMAP: false
      SKIP_PREFLIGHT_CHECK: true
      FAST_REFRESH: true
      CHOKIDAR_USEPOLLING: true
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm start"
    networks:
      - dendreo_network
    depends_on:
      - backend

  # Development Database
  postgres:
    image: postgres:15
    container_name: dendreo_postgres_dev
    environment:
      POSTGRES_DB: dendreo_dev_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d/
    networks:
      - dendreo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dendreo_dev_db"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_dev_data:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  dendreo_network:
    driver: bridge 