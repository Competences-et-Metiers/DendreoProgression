services:
  # Production Nginx + Frontend (single image: nginx serves the baked-in React build)
  nginx:
    image: ghcr.io/competences-et-metiers/dendreoprogression-frontend:main
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend.prod
      args:
        BRANCH: ${PROD_BRANCH:-main}
        REACT_APP_API_URL: /api
        REACT_APP_AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
        REACT_APP_AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
        REACT_APP_AZURE_AD_REDIRECT_URI: ${AZURE_AD_REDIRECT_URI:-}
        BUILD_DATE: ${BUILD_DATE:-$(date)}
        BUILD_VERSION: ${BUILD_VERSION:-$(git rev-parse HEAD 2>/dev/null || echo 'no-git')}
    container_name: dendreo_nginx_prod
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.active.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
      # SSL certificates
      - ./ssl:/etc/nginx/ssl:ro
      # Timezone mapping
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - dendreo_network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - .env.prod

  # Production Backend
  backend:
    image: ghcr.io/competences-et-metiers/dendreoprogression-backend:main
    build:
      context: ./back
      dockerfile: Dockerfile.backend.prod
    mem_limit: 1g
    env_file:
      - .env.prod
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
      # Security Configuration
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      # API Configuration
      DENDREO_API_KEY: ${DENDREO_API_KEY}
      DENDREO_BASE_URL: ${DENDREO_BASE_URL}
      HUBSPOT_API_KEY: ${HUBSPOT_API_KEY}
      # Redis configuration (optional)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      # Microsoft Entra ID (Azure AD) - Optional
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
      AZURE_AD_ADMIN_GROUP_ID: ${AZURE_AD_ADMIN_GROUP_ID:-}
      # Timezone configuration
      POSTGRES_TZ: ${POSTGRES_TZ:-Europe/Paris}
      TZ: ${TZ:-Europe/Paris}
    # Backend only exposed internally - nginx handles external traffic
    expose:
      - "${BACKEND_PORT:-8000}"
    volumes:
      - ./logs:/app/logs
      # Timezone mapping
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dendreo_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Production Sync Service
  sync:
    image: ghcr.io/competences-et-metiers/dendreoprogression-sync:main
    build:
      context: ./back
      dockerfile: Dockerfile.sync.prod
    container_name: dendreo_sync_prod
    mem_limit: 1g
    env_file:
      - .env.prod
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${SYNC_LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
      # API Configuration
      DENDREO_API_KEY: ${DENDREO_API_KEY}
      DENDREO_BASE_URL: ${DENDREO_BASE_URL}
      HUBSPOT_API_KEY: ${HUBSPOT_API_KEY}
      # Redis configuration (optional)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      # Timezone configuration
      POSTGRES_TZ: ${POSTGRES_TZ:-Europe/Paris}
      TZ: ${TZ:-Europe/Paris}
      # Sync Configuration - Hourly cron check (DB config controls actual schedule)
      SYNC_SCHEDULE: ${SYNC_SCHEDULE:-0 * * * *}
      DENDREO_ADF_LIMIT: ${DENDREO_ADF_LIMIT:-}
      SKIP_STARTUP_SYNC: ${SKIP_STARTUP_SYNC:-true}
      DISABLE_CRON_SCHEDULE: ${DISABLE_CRON_SCHEDULE:-false}
    # Auto-migrate DB schema before starting cron/entrypoint
    command: ["bash", "-lc", "echo '⏳ Waiting for database...'; until pg_isready -h postgres -p 5432 -U '$POSTGRES_USER' -d '$POSTGRES_DB' -t 3 >/dev/null 2>&1; do echo '...still waiting'; sleep 2; done; echo '✅ Database is ready'; python3 scripts/migrate_database.py || echo '⚠️  Migration failed or skipped'; exec /app/entrypoint.sh"]
    volumes:
      - ./logs:/app/logs:rw
      - sync_logs:/app/logs/sync
      # Override sync wrapper script with production version
      - ./back/scripts/sync_wrapper_prod.sh:/app/sync_wrapper_cron.sh:ro
      # Add diagnostic and management scripts
      - ./back/scripts/check_sync_status.py:/app/scripts/check_sync_status.py:ro
      - ./back/scripts/setup_sync_table.py:/app/scripts/setup_sync_table.py:ro
      - ./back/scripts/diagnose_cron.py:/app/scripts/diagnose_cron.py:ro
      # Timezone mapping
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - dendreo_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "scripts/sync_health_check.py", "--nagios", "--exit-code"]
      interval: 1h
      timeout: 30s
      retries: 3
      start_period: 5m
    labels:
      - "dendreo.service=sync-prod"
      - "dendreo.description=Production sync service for automated data synchronization"

  # Production Database
  postgres:
    image: postgres:15
    container_name: dendreo_postgres_prod
    mem_limit: 1g
    env_file:
      - .env.prod
    environment:
      # Set PostgreSQL timezone to match container timezone
      POSTGRES_TZ: ${POSTGRES_TZ:-Europe/Paris}
      TZ: ${TZ:-Europe/Paris}
    # Remove external port exposure for security
    expose:
      - "5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d/
      # Timezone mapping
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - dendreo_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dendreo_prod_db}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Netdata - Real-time Resource Monitoring
  netdata:
    image: netdata/netdata:stable
    container_name: dendreo_netdata_prod
    hostname: dendreo-prod
    mem_limit: 512m
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    ports:
      - "${NETDATA_PORT:-19999}:19999"
    volumes:
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - dendreo_network
    restart: unless-stopped
    env_file:
      - .env.prod

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: dendreo_redis_prod
    mem_limit: 256m
    expose:
      - "6379"
    volumes:
      - redis_prod_data:/data
      # Timezone mapping
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - dendreo_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - .env.prod

volumes:
  postgres_prod_data:
    driver: local
  sync_logs:
    driver: local
  redis_prod_data:
    driver: local
  netdata_lib:
    driver: local
  netdata_cache:
    driver: local

networks:
  dendreo_network:
    driver: bridge 