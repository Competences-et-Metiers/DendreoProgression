services:
  # Production Nginx (Load Balancer & Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: dendreo_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
      # Uncomment for SSL support:
      # - ./ssl:/etc/nginx/ssl:ro
    networks:
      - dendreo_network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - .env.prod

  # Production Backend
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile.optimized
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/dendreo_prod_db?client_encoding=utf8
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: 1
      # API Configuration
      DENDREO_API_KEY: ${DENDREO_API_KEY}
      DENDREO_BASE_URL: ${DENDREO_BASE_URL}
      HUBSPOT_API_KEY: ${HUBSPOT_API_KEY}
      # Redis configuration (optional)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
    env_file:
      - .env.prod
    # Backend only exposed internally - nginx handles external traffic
    expose:
      - "8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dendreo_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Production Frontend
  frontend:
    image: node:18-alpine
    working_dir: /app
    environment:
      NODE_ENV: production
      # Frontend communicates with backend via host port
      REACT_APP_API_URL: /api
      HOST: 0.0.0.0
      PORT: 3000
      GENERATE_SOURCEMAP: false
      SKIP_PREFLIGHT_CHECK: true
      FAST_REFRESH: true
      CHOKIDAR_USEPOLLING: true
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm start"
    networks:
      - dendreo_network
    depends_on:
      - backend

  # Production Database
  postgres:
    image: postgres:15
    container_name: dendreo_postgres_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dendreo_prod_db}
      POSTGRES_USER: ${POSTGRES_USER:-dendreo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      # Production performance settings
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-256MB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-200}
    env_file:
      - .env.prod
    # Remove external port exposure for security
    expose:
      - "5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d/
    networks:
      - dendreo_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dendreo_user -d dendreo_prod_db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Optional: Redis for caching (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: dendreo_redis_prod
  #   expose:
  #     - "6379"
  #   volumes:
  #     - redis_prod_data:/data
  #   networks:
  #     - dendreo_network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   env_file:
  #     - .env.prod

volumes:
  postgres_prod_data:
    driver: local
  frontend_node_modules:
    driver: local
  # redis_prod_data:
  #   driver: local

networks:
  dendreo_network:
    driver: bridge 