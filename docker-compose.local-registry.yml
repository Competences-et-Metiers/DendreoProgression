services:
  # Local Docker Registry
  registry:
    image: registry:2
    container_name: local_registry
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: true
    networks:
      - dendreo_network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: dendreo_postgres_local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dendreo_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d/
    networks:
      - dendreo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dendreo_db}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Backend from Local Registry
  backend:
    image: localhost:5000/dendreo-backend:${IMAGE_TAG:-latest}
    container_name: dendreo_backend_local
    build:
      context: ./back
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-dendreo_db}
      DENDREO_API_KEY: ${DENDREO_API_KEY}
      DENDREO_BASE_URL: ${DENDREO_BASE_URL}
      HUBSPOT_API_KEY: ${HUBSPOT_API_KEY}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      registry:
        condition: service_started
    volumes:
      - backend_logs:/app/logs
    networks:
      - dendreo_network

  # React Frontend from Local Registry
  frontend:
    image: localhost:5000/dendreo-frontend:${IMAGE_TAG:-latest}
    container_name: dendreo_frontend_local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
      registry:
        condition: service_started
    networks:
      - dendreo_network

volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local
  registry_data:
    driver: local

networks:
  dendreo_network:
    driver: bridge 