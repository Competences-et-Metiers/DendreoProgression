[defaults]
# Use the local inventory file
inventory = inventory/hosts.yml

# SSH into new servers without host key prompts
# Safe here because Terraform just created the server — we know the IP is ours.
host_key_checking = False

# Speed up connections by reusing SSH sessions
pipelining = True

# Default user for initial setup (Scaleway provisions root)
remote_user = root

# Roles path
roles_path = roles

# Reduce output noise
callback_whitelist = profile_tasks
stdout_callback = yaml

[privilege_escalation]
become = True
become_method = sudo
