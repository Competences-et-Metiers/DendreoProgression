---
# ==========================================================================
# Backup role: automated pg_dump to Scaleway Object Storage
# ==========================================================================
# Replaces the Google Drive approach with Scaleway's S3-compatible storage.
# Uses rclone because it handles multipart uploads, retries, and works
# identically with S3/R2/B2/GDrive if you ever switch providers.

# --- Install rclone ---
# rclone is a universal cloud storage CLI. One binary, no dependencies.
- name: Install rclone
  shell: curl https://rclone.org/install.sh | bash
  args:
    creates: /usr/bin/rclone  # Skip if already installed

# --- Configure rclone for Scaleway Object Storage ---
# Scaleway Object Storage is S3-compatible, so we configure rclone
# with the s3 provider type. Credentials come from Ansible vars
# (which you set in inventory/hosts.yml).
- name: Create rclone config directory
  file:
    path: "/home/{{ deploy_user }}/.config/rclone"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0700"

- name: Configure rclone for Scaleway S3
  copy:
    content: |
      [scaleway]
      type = s3
      provider = Scaleway
      access_key_id = {{ scw_access_key }}
      secret_access_key = {{ scw_secret_key }}
      region = {{ backup_region }}
      endpoint = s3.{{ backup_region }}.scw.cloud
      acl = private
    dest: "/home/{{ deploy_user }}/.config/rclone/rclone.conf"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"  # Secrets — owner-only read

# --- Backup script ---
# This script:
#   1. Runs pg_dump inside the postgres container
#   2. Compresses with gzip
#   3. Uploads to Scaleway Object Storage under daily/ prefix
#   4. Cleans up local files older than 7 days
# The daily/ prefix matches the Terraform lifecycle rule that auto-expires
# objects after backup_retention_days.
- name: Deploy backup script
  template:
    src: backup_db.sh.j2
    dest: "{{ app_dir }}/scripts/backup_db.sh"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

# --- Cron job ---
# Runs daily at the configured hour (default 2 AM Paris time).
# Runs as the deploy user (has docker group access for pg_dump).
- name: Set up daily backup cron job
  cron:
    name: "dendreo_db_backup"
    user: "{{ deploy_user }}"
    hour: "{{ backup_cron_hour }}"
    minute: "{{ backup_cron_minute }}"
    job: "{{ app_dir }}/scripts/backup_db.sh >> {{ app_dir }}/logs/backup.log 2>&1"
