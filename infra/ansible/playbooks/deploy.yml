---
# ==========================================================================
# Deployment playbook
# ==========================================================================
# Pulls the latest Docker images and restarts the stack.
# Used for both manual deploys and GitHub Actions CI/CD.
#
# Usage:
#   cd infra/ansible
#   ansible-playbook playbooks/deploy.yml
#
# Or from GitHub Actions (uses the deploy user, not root):
#   ansible-playbook -u deploy playbooks/deploy.yml

- name: Deploy Dendreo application
  hosts: dendreo_server
  become: yes
  become_user: "{{ deploy_user }}"

  tasks:
    # --- Sync encrypted secrets so env var changes can be re-decrypted ---
    # The .env.prod itself is regenerated on the server via setup-server.sh
    # which needs the age private key. We just push the encrypted source.
    - name: Copy encrypted secrets
      copy:
        src: "{{ playbook_dir }}/../../../secrets/"
        dest: "{{ app_dir }}/secrets/"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"

    # --- Pull latest images from GHCR (built by GitHub Actions CI) ---
    - name: Pull latest Docker images
      command: docker compose -f docker-compose.prod.yml pull
      args:
        chdir: "{{ app_dir }}"

    # --- Start / restart services using pre-built images ---
    # No --build: VPS has no source, images come from GHCR.
    - name: Start services
      command: >
        docker compose -f docker-compose.prod.yml
        --env-file .env.prod
        up -d --remove-orphans
      args:
        chdir: "{{ app_dir }}"

    # --- Health check ---
    # Backend container exposes 8000 only on the docker network (not the VPS host),
    # so we hit /health via docker exec instead of the uri module.
    - name: Wait for backend health check
      shell: |
        set -o pipefail
        BACKEND=$(docker ps --format '{{ "{{" }}.Names{{ "}}" }}' | grep -E 'backend' | grep -v grep | head -1)
        [ -z "$BACKEND" ] && exit 1
        docker exec "$BACKEND" curl -sf --max-time 5 http://localhost:8000/health
      args:
        executable: /bin/bash
      register: health
      retries: 10
      delay: 10
      until: health.rc == 0
      changed_when: false

    # --- Show status ---
    - name: Show running containers
      command: docker compose -f docker-compose.prod.yml ps
      args:
        chdir: "{{ app_dir }}"
      register: compose_status

    - name: Display status
      debug:
        var: compose_status.stdout_lines
